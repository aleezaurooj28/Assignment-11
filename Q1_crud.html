<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API CRUD Practice</title>
    <link rel="stylesheet" href="Q1_crud.css">
</head>
<body>
    <header>
        <h1>Fetch API CRUD Practice</h1>
        <div class="http-methods-badge">GET | POST | PUT | PATCH | DELETE</div>
    </header>

    <main class="dashboard-layout">
        <!-- Input Control Panel Panel Section -->
        <section class="panel form-panel">
            <h2>Add New Post</h2>
            <form id="add-post-form">
                <div class="input-group">
                    <label for="post-title">Post Title:</label>
                    <input type="text" id="post-title" name="title" required placeholder="Enter an engaging title">
                </div>
                
                <div class="input-group">
                    <label for="post-userid">User ID:</label>
                    <input type="number" id="post-userid" name="userId" required min="1" placeholder="Enter numeric User ID">
                </div>
                
                <div class="input-group">
                    <label for="post-body">Post Content:</label>
                    <textarea id="post-body" name="body" required placeholder="Type the main article markdown text..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-submit" class="btn btn-add">Add Post</button>
                    <button type="button" id="btn-reload" class="btn btn-reload">Reload Posts</button>
                </div>
            </form>
            
            <div id="status-container" class="status-box" aria-live="polite"></div>
        </section>

        <!-- Response Results View Section -->
        <section class="panel display-panel">
            <h2>Posts Feed View</h2>
            <div id="loading-spinner" class="loading-state">Syncing server records context...</div>
            <div id="posts-grid-container" class="posts-grid"></div>
        </section>
    </main>

    <script src="Q1_crud.js"></script>
</body>
</html>
